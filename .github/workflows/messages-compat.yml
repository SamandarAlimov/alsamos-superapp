name: Messages compatibility

on:
  push:
    branches: [main]
    paths:
      - 'lib/features/messages/**'
      - 'test/features/messages/**'
      - '.github/workflows/messages-compat.yml'
  pull_request:
    paths:
      - 'lib/features/messages/**'
      - 'test/features/messages/**'
      - '.github/workflows/messages-compat.yml'

concurrency:
  group: messages-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messages-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze message protocol and renderers
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/features/messages/data/models/message_payload_compat.dart
          lib/features/messages/data/models/message_format.dart
          lib/features/messages/data/models/message_model.dart
          lib/features/messages/data/models/conversation_model.dart
          lib/features/messages/presentation/widgets/message_content_rich.dart
          lib/features/messages/presentation/widgets/canonical_rich_composer.dart
          lib/features/messages/presentation/widgets/message_bubble.dart
          lib/features/messages/presentation/providers/messages_provider.dart
          lib/features/messages/presentation/providers/conversations_provider.dart
          lib/features/messages/presentation/pages/chat_page.dart
          lib/features/messages/presentation/pages/messages_page.dart

      - name: Cross-app protocol tests
        run: >-
          flutter test
          test/features/messages/message_payload_compat_test.dart
          test/features/messages/message_format_test.dart
          test/features/messages/conversation_draft_test.dart
          test/features/messages/canonical_rich_composer_test.dart
