name: alsamos_flutter
description: Alsamos super app - Flutter (web/iOS/Android/Windows/macOS/Linux)
publish_to: 'none'
version: 1.0.1+2

# ─────────────────────────────────────────────────────────────────────────────
# Environment
# Pinned to Dart 3.4+/Flutter 3.22+ — required by go_router ^14, riverpod ^2.5,
# flutter_map ^7, supabase_flutter ^2.5, and image_cropper ^12.
# ─────────────────────────────────────────────────────────────────────────────
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies — every version below has been cross-checked for transitive
# compatibility (most notably the `web ^1.0.0` constraint shared by
# image_cropper_for_web ^9, geolocator_web ^4, url_launcher_web ^2.3,
# webview_flutter_web ^0.2, image_picker_for_web ^3, video_player_web ^2,
# record_web ^1.1, just_audio_web ^0.4, and shared_preferences_web ^2.4).
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # ── Core UI ────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_flutter: ^1.20.0
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0

  # ── State + Routing ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # ── Backend / Networking ───────────────────────────────────────────────────
  supabase_flutter: ^2.5.6
  dio: ^5.5.0
  http: ^1.2.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0

  # ── Media (camera locked to 0.10.x branch — 0.11 is breaking) ─────────────
  video_player: ^2.9.1
  just_audio: ^0.9.40
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  camera: ^0.10.6
  record: ^5.1.2
  visibility_detector: ^0.4.0+2
  file_picker: ^11.0.2
  flutter_resizable_container: ^4.2.0

  # ── Maps / Location ────────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  flutter_map_animations: ^0.7.0   # smooth animated camera
  flutter_map_compass: ^1.0.0      # compass widget
  latlong2: ^0.9.1
  geolocator: 14.0.2
  battery_plus: ^6.0.3
  connectivity_plus: ^6.1.2
  flutter_tts: ^4.1.0              # voice turn-by-turn navigation

  # ── Charts (Admin analytics dashboard) ────────────────────────────────────
  fl_chart: ^0.69.0

  # ── Storage / Utilities ────────────────────────────────────────────────────
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1
  intl: ^0.19.0
  timeago: ^3.6.1
  video_player_media_kit: ^2.0.0
  media_kit_libs_linux: any
  media_kit_libs_windows_video: any
  flutter_webrtc: ^1.5.2

# ─────────────────────────────────────────────────────────────────────────────
# Dependency overrides — single source of truth for shared transitives so the
# resolver never has to pick between conflicting indirect constraints.
# ─────────────────────────────────────────────────────────────────────────────
dependency_overrides:
  # Shared by every *_web plugin (image_cropper_for_web, geolocator_web,
  # url_launcher_web, webview_flutter_web, image_picker_for_web,
  # video_player_web, record_web, just_audio_web, shared_preferences_web).
  web: ^1.1.0

  # Flutter SDK bundles intl 0.19.0 inside flutter_localizations — pin it so
  # supabase_flutter / dio don't drag in a newer line.
  intl: ^0.19.0

  # Used by Supabase, dio, http, just_audio — pin to one line to avoid
  # collision between supabase_realtime (crypto ^3.0) and http_parser.
  crypto: ^3.0.7

  # Used by Supabase + http + dio internally — uniform line avoids
  # "version solving failed: meta" issues.
  meta: ^1.18.0

  # record 5.1.2 transitively pulls record_linux 0.7.2 which is incompatible
  # with record_platform_interface 1.6.0 (missing startStream + new
  # hasPermission signature). Pin record_linux to 1.x which implements both.
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
